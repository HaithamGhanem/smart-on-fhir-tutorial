<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>SMART on FHIR – Cerner (Working)</title>
</head>
<body>

<h3>SMART on FHIR – Patient</h3>
<pre id="output">Waiting for launch...</pre>

<script>
/* ========== CONFIG ========== */
const CLIENT_ID = "8774d3ff-ca56-416b-b5d1-3df7c0589390";
/* IMPORTANT: must EXACTLY match Cerner App Gallery */
const REDIRECT_URI = window.location.origin + window.location.pathname;

const SCOPES = "launch patient/*.read openid fhirUser";

/* ========== HELPERS ========== */
function param(name) {
  return new URLSearchParams(window.location.search).get(name);
}

const output = document.getElementById("output");

/* ========== MAIN FLOW ========== */
(async function () {
  const iss = param("iss");
  const launch = param("launch");
  const code = param("code");

  /* STEP 1: Cerner launches app */
  if (!code && iss && launch) {
    const authUrl =
      `${iss}/authorize?` +
      `response_type=code` +
      `&client_id=${CLIENT_ID}` +
      `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
      `&scope=${encodeURIComponent(SCOPES)}` +
      `&aud=${encodeURIComponent(iss)}` +
      `&launch=${encodeURIComponent(launch)}`;

    window.location.href = authUrl;
    return;
  }

  /* STEP 2: Exchange code for token */
  if (code && iss) {
    output.textContent = "Exchanging code for token...";

    const tokenResp = await fetch(`${iss}/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body:
        `grant_type=authorization_code` +
        `&code=${encodeURIComponent(code)}` +
        `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
        `&client_id=${CLIENT_ID}`
    });

    const token = await tokenResp.json();

    console.log("TOKEN RESPONSE", token);

    if (!token.access_token) {
      output.textContent = "❌ Token error:\n" + JSON.stringify(token, null, 2);
      return;
    }

    /* STEP 3: Use token to get patient */
    const patientId = token.patient;
    const accessToken = token.access_token;

    output.textContent =
      "Authorized.\nPatient ID: " + patientId + "\nLoading patient...";

    const patientResp = await fetch(
      `${iss}/Patient/${patientId}`,
      {
        headers: {
          "Authorization": `Bearer ${accessToken}`,
          "Accept": "application/fhir+json"
        }
      }
    );

    if (!patientResp.ok) {
      output.textContent =
        "FHIR error " + patientResp.status;
      return;
    }

    const patient = await patientResp.json();
    output.textContent = JSON.stringify(patient, null, 2);
  }
})();
</script>

</body>
</html>
