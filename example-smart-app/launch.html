<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Simple SMART App</title>
</head>
<body>

<h3>SMART on FHIR – Patient Details</h3>
<pre id="output">Waiting...</pre>

<script>
const CLIENT_ID = "YOUR_CLIENT_ID";
const REDIRECT_URI = window.location.origin + window.location.pathname;
const SCOPES = "launch patient/*.read openid fhirUser";

function param(name) {
  return new URLSearchParams(window.location.search).get(name);
}

(async function () {
  const iss = param("iss");
  const launch = param("launch");
  const code = param("code");
  const output = document.getElementById("output");

  /* ========== STEP 1: Launch ========== */
  if (!code && iss && launch) {
    const authUrl =
      `${iss}/authorize?` +
      `response_type=code` +
      `&client_id=${CLIENT_ID}` +
      `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
      `&scope=${encodeURIComponent(SCOPES)}` +
      `&aud=${encodeURIComponent(iss)}` +
      `&launch=${encodeURIComponent(launch)}`;

    window.location.href = authUrl;
    return;
  }

  /* ========== STEP 2: Token ========== */
  if (code && iss) {
    const tokenResp = await fetch(`${iss}/token`, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body:
        `grant_type=authorization_code` +
        `&code=${code}` +
        `&redirect_uri=${encodeURIComponent(REDIRECT_URI)}` +
        `&client_id=${CLIENT_ID}`
    });

    const token = await tokenResp.json();

    const accessToken = token.access_token;
    const patientId = token.patient;

    output.textContent = "Patient ID from token: " + patientId;

    /* ========== STEP 3: Get Patient ========== */
    const patientResp = await fetch(
      `${iss}/Patient/${patientId}`,
      {
        headers: {
          "Authorization": `Bearer ${accessToken}`,
          "Accept": "application/fhir+json"
        }
      }
    );

    const patient = await patientResp.json();
    output.textContent = JSON.stringify(patient, null, 2);
  }
})();
</script>

</body>
</html>
